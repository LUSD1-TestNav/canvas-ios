name: Build Canvas iOS IPAs

on:
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [Student, Teacher, Parent]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build dependencies
        run: |
          brew install xcodegen yarn
          make sync

      - name: Generate Secrets
        env:
          STUDENT_ID: ${{ secrets.STUDENT_CLIENT_ID }}
          STUDENT_SECRET: ${{ secrets.STUDENT_CLIENT_SECRET }}
          TEACHER_ID: ${{ secrets.TEACHER_CLIENT_ID }}
          TEACHER_SECRET: ${{ secrets.TEACHER_CLIENT_SECRET }}
          PARENT_ID: ${{ secrets.PARENT_CLIENT_ID }}
          PARENT_SECRET: ${{ secrets.PARENT_CLIENT_SECRET }}
        run: |
          yarn build-secrets \
            "studentClientID=$STUDENT_ID" \
            "studentClientSecret=$STUDENT_SECRET" \
            "teacherClientID=$TEACHER_ID" \
            "teacherClientSecret=$TEACHER_SECRET" \
            "parentClientID=$PARENT_ID" \
            "parentClientSecret=$PARENT_SECRET"

      - name: Build Unsigned App Archive
        run: |
          xcodebuild clean build \
            -workspace Canvas.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app" Payload/
          zip -qr "Canvas-${{ matrix.scheme }}-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canvas-${{ matrix.scheme }}-IPA
          path: Canvas-${{ matrix.scheme }}-unsigned.ipa
